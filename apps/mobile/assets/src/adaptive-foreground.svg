    <clipPath id="dieClip"><path d="M473.9 312 Q512 290 550.1 312 L666.2 379 Q704.3 401 704.3 445 L704.3 579 Q704.3 623 666.2 645 L550.1 712 Q512 734 473.9 712 L357.8 645 Q319.7 623 319.7 579 L319.7 445 Q319.7 401 357.8 379 Z"/></clipPath>
