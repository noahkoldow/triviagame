    <line x1="512" y1="512" x2="884" y2="512" stroke="#58CC02" stroke-width="80" stroke-linecap="round"/><circle cx="884" cy="512" r="64" fill="#58CC02"/><circle cx="884" cy="512" r="22" fill="#131F24"/>
    <line x1="512" y1="512" x2="512" y2="884" stroke="#CE82FF" stroke-width="80" stroke-linecap="round"/><circle cx="512" cy="884" r="64" fill="#CE82FF"/><circle cx="512" cy="884" r="22" fill="#131F24"/>
